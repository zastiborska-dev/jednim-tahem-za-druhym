<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jedním tahem za druhým – Vendula Krpcová, kaligrafie na míru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --stone:#F2EFEA; --line:#E4DFD8;
  --ink:#1D1B19; --muted:#69625B; --accent:#4B2639; --accent-soft:#F1EBEE;
  --sage:#4E5E4C; --radius:14px; --maxw:1120px;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,6vw,4rem)}
h2{font-size:clamp(1.9rem,4vw,2.6rem)}
h3{font-size:1.45rem}
p+p{margin-top:.8em}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:1.125rem;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
section{padding:72px 0}
section.tight{padding:48px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px;flex-wrap:wrap}
.section-head p{max-width:52ch}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(250,249,246,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{text-decoration:none;display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--serif);font-size:1.35rem;font-weight:600}
.brand span{font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav.main{display:flex;gap:26px;align-items:center}
nav.main a{text-decoration:none;font-size:.92rem;color:var(--muted)}
nav.main a:hover,nav.main a.on{color:var(--ink)}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:.9rem;cursor:pointer}
@media (max-width:820px){
  .menu-btn{display:block}
  nav.main{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);flex-direction:column;align-items:flex-start;padding:16px 20px 24px;border-bottom:1px solid var(--line);gap:14px}
  nav.main.open{display:flex}
  nav.main a{font-size:1.05rem}
}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:500;font-size:.95rem;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#3a1c2c}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.ghost:hover{border-color:var(--ink)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.link-arrow{font-weight:500;text-decoration:none;color:var(--accent);font-size:.95rem}
.link-arrow:hover{text-decoration:underline}

/* hero */
.hero{padding:64px 0 56px}
.hero .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero .lead{margin-top:20px}
.hero-photo{position:relative}
.hero-photo img{border-radius:var(--radius);aspect-ratio:4/5;object-fit:cover;width:100%}
.hero-photo .badge{position:absolute;left:-18px;bottom:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.hero-photo .badge b{display:block;font-family:var(--serif);font-size:1.15rem}
@media (max-width:820px){.hero .grid{grid-template-columns:1fr;gap:36px}.hero-photo .badge{left:12px}}

/* audience switch */
.switch{display:inline-flex;background:var(--stone);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.switch button{border:0;background:none;font:inherit;font-size:.9rem;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--muted)}
.switch button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* service cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:.18s}
.card:hover{border-color:#cfc7bd;transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.06)}
.card .thumb{aspect-ratio:3/2;object-fit:cover;width:100%;background:var(--stone)}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.35rem}
.card p{font-size:.92rem;color:var(--muted)}
.card .foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.card .price{font-weight:600}
.card .go{color:var(--accent);font-weight:500}
.card.hidden{display:none}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--stone);color:var(--muted);font-weight:500}

/* case cards */
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:900px){.cases{grid-template-columns:1fr}}
.case-card{text-decoration:none;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.18s}
.case-card:hover{box-shadow:0 10px 28px rgba(0,0,0,.06);transform:translateY(-2px)}
.case-card img{aspect-ratio:4/3;object-fit:cover;width:100%}
.case-card .body{padding:18px 20px 22px}
.case-card h3{margin:6px 0 6px}
.case-card p{font-size:.92rem;color:var(--muted)}

/* callouts */
.callouts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.callouts{grid-template-columns:1fr}}
.callout{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 24px}
.callout .label{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.callout .label i{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-style:normal;font-size:.75rem}
.callout ul{padding-left:18px}
.callout li+li{margin-top:6px}
.callout.note{background:var(--stone);border-color:transparent}
.callout.warn{border-left:4px solid var(--accent)}
.callout.placeholder{border:1.5px dashed #c8beb3;background:transparent;color:var(--muted)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-weight:600;font-size:.9rem;margin-bottom:14px}
.step h3{font-size:1.25rem;margin-bottom:6px}
.step p{font-size:.92rem;color:var(--muted)}

/* quote */
.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:36px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
.quote .mark{font-family:var(--serif);font-size:5rem;line-height:.7;color:var(--accent)}
.quote blockquote{font-family:var(--serif);font-size:1.4rem;line-height:1.4}
.quote cite{display:block;margin-top:16px;font-style:normal;font-size:.9rem;color:var(--muted)}
.quote cite b{color:var(--ink)}
@media (max-width:600px){.quote{grid-template-columns:1fr;padding:26px}.quote blockquote{font-size:1.2rem}}

/* page header (detail views) */
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:18px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.page-head{padding:48px 0 24px}
.page-head .lead{margin-top:14px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.meta div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.88rem}
.meta div span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gallery figure{position:relative;border-radius:12px;overflow:hidden;background:var(--stone)}
.gallery img{width:100%;height:100%;object-fit:cover;aspect-ratio:1/1}
.gallery figure.wide{grid-column:span 2}
.gallery figure.wide img{aspect-ratio:2/1}
.gallery figure.contain img{object-fit:contain;background:#fff;padding:20px}
.gallery figcaption{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);font-size:.75rem;padding:4px 9px;border-radius:999px}
@media (max-width:700px){.gallery{grid-template-columns:1fr 1fr}.gallery figure.wide{grid-column:span 2}}

/* pricing */
.price-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.price-block + .price-block{margin-top:20px}
.price-block header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.price-block header h3{font-size:1.4rem}
.price-block header a{font-size:.85rem}
.price-row{display:grid;grid-template-columns:1fr auto;gap:6px 20px;padding:16px 24px;border-bottom:1px solid var(--line)}
.price-row:last-of-type{border-bottom:0}
.price-row .name{font-weight:600}
.price-row .val{font-weight:600;white-space:nowrap;text-align:right}
.price-row .desc{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
.price-row.sub .name{font-weight:500;padding-left:14px;border-left:2px solid var(--line)}
.price-foot{background:var(--stone);padding:14px 24px;font-size:.85rem;color:var(--muted)}
.packages{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.packages{grid-template-columns:1fr}}
.pkg{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column}
.pkg.featured{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pkg .pname{font-family:var(--serif);font-size:1.5rem;font-weight:600}
.pkg .pval{font-size:1.5rem;font-weight:600;margin:6px 0 14px}
.pkg .pval small{font-size:.85rem;font-weight:400;color:var(--muted)}
.pkg ul{padding-left:18px;font-size:.92rem;color:var(--muted)}
.pkg li+li{margin-top:6px}
.pkg .flag{align-self:flex-start;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;margin-bottom:10px}

/* two-col */
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr;gap:28px}}
.words{display:flex;flex-direction:column;gap:22px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px}
.words img{max-height:70px;width:auto}

/* cta + footer */
.cta{background:var(--ink);color:#fff;border-radius:20px;padding:56px 40px;text-align:center}
.cta h2{color:#fff}
.cta p{color:#cfc9c2;margin:14px auto 0;max-width:52ch}
.cta .btn.primary{background:#fff;color:var(--ink)}
.cta .btn.ghost{background:transparent;border-color:#5a5550;color:#fff}
.cta .btn-row{justify-content:center}
footer{padding:48px 0 60px;border-top:1px solid var(--line);margin-top:72px;font-size:.9rem;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}
.contact-list{display:grid;gap:14px;margin-top:18px}
.contact-list a,.contact-list div{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.contact-list span.k{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);min-width:80px}
.demo-bar{background:var(--stone);font-size:.8rem;color:var(--muted);text-align:center;padding:7px 12px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#">
      <b>Jedním tahem za druhým</b>
      <span>Vendula Krpcová · kaligrafie</span>
    </a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false">Menu</button>
    <nav class="main" id="nav">
      <a href="#sluzby" data-nav="sluzby">Služby</a>

      <a href="#kontakt" class="btn primary" style="padding:9px 18px;color:#fff">Napište mi</a>

  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div>
      <div style="font-family:var(--serif);font-size:1.3rem;color:var(--ink)">Jedním tahem za druhým</div>

    </div>
    <div style="display:flex;gap:22px;flex-wrap:wrap">

      <a href="https://www.instagram.com/jednimtahem_zadruhym/">Instagram</a>
    </div>
  </div>
</footer>

const SERVICES = [
  { id:"logo-identita", title:"Logo a vizuální identita", aud:["firmy"], img:"img/zenata-logo.jpg", contain:true,

  { id:"karticky", title:"Ručně psané kartičky a přání", aud:["firmy","osobni"], img:"img/karta-dekujeme.jpg",

  { id:"jmenovky", title:"Jmenovky a personalizace", aud:["firmy","osobni"], img:"img/jmenovka-simona.jpg",

  { id:"plakaty-tiskoviny", title:"Plakáty, menu a tiskoviny", aud:["firmy"], img:"img/tabule-napoje.jpg",

    intro:"Navrhnu vám podpis, který bude osobitý a zároveň půjde snadno napodobit. Dostanete ho digitálně a k němu pracovní list, abyste si ho mohli natrénovat.",

    get:["Soubory .png a .svg pro digitální podpis","Pracovní list pro trénink","Konzultace a korektury podle balíčku"],

function priceTable(key, link){

    <div class="callout warn"><div class="label"><i>3</i>Výsledek</div>${c.vysledek}</div>
  </div></div></section>

  ${c.words?`<section class="tight"><div class="wrap split">
      <div style="background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px;display:grid;place-items:center"><img src="img/zenata-logo.jpg" alt="Logo Tereza Ženatá" style="max-width:320px"></div>
      <div class="words"><div class="eyebrow">Ručně psané hodnoty a claim</div><img src="img/w-partnerstvi.png" alt="Partnerství"><img src="img/w-udrzitelnost.png" alt="Udržitelnost"><img src="img/w-ctyrlistek.png" alt="Váš čtyřlístek v online světě" style="max-height:44px"></div>
    </div></section>`:""}
  ${c.gallery?`<section class="tight"><div class="wrap">${gallery(c.gallery)}</div></section>`:""}

  <section class="tight"><div class="wrap">${q}</div></section>

  <section class="tight"><div class="wrap"><div class="callout note" style="display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap">
    <div><div class="label" style="margin-bottom:4px">Použitá služba</div><b style="font-family:var(--serif);font-size:1.4rem">${s.title}</b> <span class="muted">· ${s.from}</span></div>
    <a class="btn ghost" href="#${s.id}">Detail služby →</a></div></div></section>

  <section class="tight"><div class="wrap"><div class="section-head"><h2>Další reference</h2></div><div class="cases" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${next.map(caseCard).join("")}</div></div></section>
  ${cta("Chcete podobný výsledek?")}`;
}

function viewProcess(){
  return `<section class="page-head"><div class="wrap">
    <div class="crumbs"><a href="#">Úvod</a> / Jak spolupracuji</div>
    <h1>Jak spolupracuji</h1><p class="lead">Co je dobré vědět před spoluprací, aby vše proběhlo hladce a výsledek odpovídal vaší představě.</p>
  </div></section>
  <section class="tight"><div class="wrap">${steps()}</div></section>
  <section class="tight"><div class="wrap"><div class="callouts">
    <div class="callout"><div class="label"><i>◷</i>Úvodní konzultace</div>Trvá 30–45 minut. Chci slyšet váš příběh a to, jak svou značku vnímáte. Připravte si klidně dotazy.</div>
    <div class="callout"><div class="label"><i>↻</i>Konzultace a korektury</div>Každý balíček má daný počet kol. První konzultace (schválení skici a barevné palety) je v ceně vždy.</div>
    <div class="callout warn"><div class="label"><i>!</i>Po schválení</div>Po vyčerpání korektur a schválení finální podoby už další úpravy v rámci balíčku nedělám. Každé další kolo je zpoplatněno 500 Kč/hod.</div>
  </div>
  <div class="callouts" style="margin-top:16px;grid-template-columns:1fr 1fr">
    <div class="callout note"><div class="label"><i>+</i>Kombinace služeb</div>Služby lze kombinovat, počítejte ale s delším časem na zpracování. Vše probereme na úvodní schůzce.</div>
    <div class="callout note"><div class="label"><i>□</i>Produkty a tisk</div>Produkty, na které se kaligrafie aplikuje, a tisk si zajišťuje klient. Já jim dodávám tvář.</div>
  </div></div></section>${cta()}`;
}

function viewPricing(){
  return `<section class="page-head"><div class="wrap">
    <div class="crumbs"><a href="#">Úvod</a> / Ceník</div>
    <h1>Orientační ceník</h1><p class="lead">Každou zakázku nacením individuálně po úvodní konzultaci (30–45 min). Konečná cena se odvíjí hlavně od počtu kusů, délky a složitosti textu, požadovaného stylu a počtu variant a úprav.</p>
    <div class="tags" style="margin-top:20px">${[["logo","logo-identita","Logo"],["karticky","karticky","Kartičky"],["plakaty","plakaty-tiskoviny","Plakáty"],["tiskoviny","plakaty-tiskoviny","Tiskoviny"],["podpis","podpis","Podpis"],["akvarel","akvarel","Akvarel"],["workshopy","workshopy","Workshopy"]].map(t=>`<a class="tag" style="text-decoration:none;font-size:.82rem;padding:6px 12px" href="javascript:void(0)" onclick="document.getElementById('p-${t[0]}').scrollIntoView({behavior:'smooth',block:'start'})">${t[2]}</a>`).join("")}</div>
  </div></section>
  <section class="tight"><div class="wrap">
    ${[["logo","logo-identita"],["karticky","karticky"],["plakaty","plakaty-tiskoviny"],["tiskoviny","plakaty-tiskoviny"],["podpis","podpis"],["akvarel","akvarel"],["workshopy","workshopy"]].map(([k,l])=>`<div id="p-${k}" style="scroll-margin-top:84px;margin-bottom:20px">${priceTable(k,l)}</div>`).join("")}
    <div class="callout placeholder" style="margin-top:20px"><div class="label"><i>?</i>K doplnění</div>Uveďte, zda jsou ceny s DPH, nebo že nejste plátce DPH, a orientační dodací lhůty. Firmy to obvykle řeší jako první.</div>
  </div></section>${cta()}`;
}

function viewContact(){
  return `<section class="page-head"><div class="wrap split">
    <div>
      <div class="crumbs"><a href="#">Úvod</a> / Kontakt</div>
      <h1>Napište mi</h1>
      <p class="lead">Rádi byste originální vizuální identitu, personalizované nápisy a tiskoviny nebo kreativní zážitek? Společně vymyslíme, co by mohlo fungovat právě pro vás.</p>
      <div class="contact-list">
        <a href="mailto:${EMAIL}"><span class="k">E-mail</span>${EMAIL}</a>
        <a href="https://www.instagram.com/jednimtahem_zadruhym/"><span class="k">Instagram</span>@jednimtahem_zadruhym</a>
        <div><span class="k">LinkedIn</span>Vendula Krpcová</div>
      </div>
    </div>
    <form id="form" class="callout" style="padding:28px">
      <div class="label"><i>✉</i>Poptávka</div>
      ${field("Jméno a firma","name","text")}
      ${field("E-mail","email","email")}
      <label style="display:block;margin-top:14px;font-size:.85rem;font-weight:500">Co vás zajímá
        <select name="svc" style="${inputCss()}">${SERVICES.map(s=>`<option>${s.title}</option>`).join("")}<option>Ještě nevím</option></select></label>
      <label style="display:block;margin-top:14px;font-size:.85rem;font-weight:500">Vaše představa
        <textarea name="msg" rows="5" style="${inputCss()}" placeholder="Pro koho to bude, kolik kusů, termín…"></textarea></label>
      <button class="btn primary" style="margin-top:18px;width:100%;justify-content:center">Připravit e-mail</button>
      <p id="formOut" class="muted" style="font-size:.85rem;margin-top:12px"></p>
    </form>
  </div></section>`;
}
function inputCss(){return "display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:400;background:var(--bg)";}
function field(l,n,t){return `<label style="display:block;margin-top:14px;font-size:.85rem;font-weight:500">${l}<input name="${n}" type="${t}" style="${inputCss()}"></label>`;}

/* ---------- router ---------- */
const app = document.getElementById("app");
function render(){
  const h = (location.hash||"").slice(1);
  let html, nav="";
  if(!h || h==="uvod") html = viewHome();
  else if(h==="sluzby"){ html = viewServices(); nav="sluzby"; }
  else if(svc(h)){ html = viewService(svc(h)); nav="sluzby"; }
  else if(h==="reference"){ html = viewReferences(); nav="reference"; }
  else if(h.startsWith("reference-") && CASES[h.slice(10)]){ html = viewCase(h.slice(10)); nav="reference"; }
  else if(h==="spoluprace"){ html = viewProcess(); nav="spoluprace"; }
  else if(h==="cenik"){ html = viewPricing(); nav="cenik"; }
  else if(h==="kontakt"){ html = viewContact(); }
  else html = viewHome();
  app.innerHTML = `<div class="view">${html}</div>`;
  document.querySelectorAll("nav.main a[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===nav));
  document.getElementById("nav").classList.remove("open");
  window.scrollTo(0,0);
  bind();
}
function bind(){
  document.querySelectorAll(".switch button").forEach(b=>b.onclick=()=>{
    b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    const f=b.dataset.f;
    document.querySelectorAll("#svcCards .card").forEach(c=>c.classList.toggle("hidden",f!=="all"&&!c.dataset.aud.includes(f)));
  });
  const form=document.getElementById("form");
  if(form) form.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(form));
    const body=`Dobrý den,\n\nzajímá mě: ${d.svc}\n\n${d.msg||""}\n\n${d.name||""}\n${d.email||""}`;
    const url=`mailto:${EMAIL}?subject=${encodeURIComponent("Poptávka: "+d.svc)}&body=${encodeURIComponent(body)}`;
    location.href=url;
    document.getElementById("formOut").textContent=`Pokud se e-mail neotevřel, napište prosím přímo na ${EMAIL}.`;
  };
}
document.getElementById("menuBtn").onclick=e=>{
  const n=document.getElementById("nav"); n.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded",n.classList.contains("open"));
};
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
